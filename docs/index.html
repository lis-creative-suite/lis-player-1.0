<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LIS PLAYER</title>
  <link rel="icon" href="logo.png" />
  <style>
    :root {
      --bg: #0b0c0f;
      --card: #16181e;
      --gold: #e6c07a;
      --ink: #f4f1ea;
      --mute: rgba(244, 241, 234, 0.55);
      --line: rgba(244, 241, 234, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.4 system-ui, "Segoe UI", sans-serif;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 48px 20px 64px;
    }
    .logo {
      display: block;
      width: 128px;
      height: 128px;
      margin: 0 auto 12px;
    }
    h1 {
      margin: 0;
      text-align: center;
      font-size: 28px;
      letter-spacing: 0.14em;
      font-weight: 600;
    }
    .links {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin: 18px 0 36px;
    }
    .links a { color: var(--gold); }
    h2 {
      margin: 0 0 12px;
      font-size: 13px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--mute);
      font-weight: 600;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: 14px 12px;
      text-align: left;
      border-bottom: 1px solid var(--line);
    }
    th {
      color: var(--mute);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .ver { font-variant-numeric: tabular-nums; }
    .now {
      margin-left: 8px;
      color: var(--gold);
      font-size: 11px;
      letter-spacing: 0.08em;
    }
    .btn {
      display: inline-block;
      margin: 0 8px 0 0;
      padding: 7px 14px;
      border: 1px solid var(--gold);
      border-radius: 999px;
      color: var(--gold);
      text-decoration: none;
      font-size: 14px;
    }
    .btn:hover { background: rgba(230, 192, 122, 0.12); }
    .empty { color: var(--mute); }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="logo.png" alt="" />
    <h1>LIS PLAYER</h1>
    <p class="links">
      <a href="https://github.com/lis-creative-suite/lis-player-1.0/blob/main/docs/%D0%98%D0%9D%D0%A1%D0%A2%D0%A0%D0%A3%D0%9A%D0%A6%D0%98%D0%AF.md">Инструкция</a>
      <a href="https://github.com/lis-creative-suite/lis-player-1.0/releases">Все выпуски</a>
    </p>
    <h2>Версии</h2>
    <table>
      <thead>
        <tr><th>Версия</th><th>Установить</th></tr>
      </thead>
      <tbody id="versions"></tbody>
    </table>
  </main>
  <script>
    const FALLBACK = [{
      tag: "v1.0.1",
      name: "1.0.1",
      assets: [
        { name: "LIS-PLAYER-Setup-1.0.1.exe", browser_download_url: "https://github.com/lis-creative-suite/lis-player-1.0/releases/download/v1.0.1/LIS-PLAYER-Setup-1.0.1.exe" },
        { name: "LIS-PLAYER-1.0.1.apk", browser_download_url: "https://github.com/lis-creative-suite/lis-player-1.0/releases/download/v1.0.1/LIS-PLAYER-1.0.1.apk" },
      ],
    }];

    function labelOf(name) {
      const lower = String(name || "").toLowerCase();
      if (lower.endsWith(".exe")) return "Windows";
      if (lower.endsWith(".apk")) return "Android";
      return "";
    }

    function versionOf(release) {
      return String(release.tag_name || release.tag || release.name || "").replace(/^v/i, "");
    }

    function button(text, href) {
      const a = document.createElement("a");
      a.className = "btn";
      a.href = href;
      a.textContent = text;
      return a;
    }

    function rowOf(release, current) {
      const tr = document.createElement("tr");
      const ver = document.createElement("td");
      ver.className = "ver";
      ver.textContent = versionOf(release);
      if (current) {
        const mark = document.createElement("span");
        mark.className = "now";
        mark.textContent = "текущая";
        ver.append(mark);
      }
      const install = document.createElement("td");
      (release.assets || [])
        .slice()
        .sort((a, b) => labelOf(a.name).localeCompare(labelOf(b.name)) * -1)
        .forEach((asset) => {
        const label = labelOf(asset.name || "");
        if (label) install.append(button(label, asset.browser_download_url));
      });
      if (!install.childElementCount) {
        const none = document.createElement("span");
        none.className = "empty";
        none.textContent = "—";
        install.append(none);
      }
      tr.append(ver, install);
      return tr;
    }

    function show(list) {
      const body = document.getElementById("versions");
      body.replaceChildren();
      list.forEach((release, index) => body.append(rowOf(release, index === 0)));
    }

    fetch("https://api.github.com/repos/lis-creative-suite/lis-player-1.0/releases")
      .then((res) => (res.ok ? res.json() : Promise.reject()))
      .then((list) => show(Array.isArray(list) && list.length ? list : FALLBACK))
      .catch(() => show(FALLBACK));
  </script>
</body>
</html>
